model_list:
  # ---- self-hosted: the 11.2 FastAPI + vLLM service on Cloud Run --------------
  - model_name: documind-inference
    litellm_params:
      model: hosted_vllm/google/gemma-3-4b-it
      api_base: os.environ/GEMMA_VLLM_URL          # .../v1 on Cloud Run
      # Cloud Run IAM wants a Google-signed ID TOKEN for THIS service's audience,
      # not a shared secret. gcp_id_token.py mints one and refreshes it; tokens
      # live ~1h, so a pasted string works all through the demo and expires in
      # production - at 3am, on a path nobody is watching.
      api_key: os.environ/GEMMA_ID_TOKEN
      rpm: 60
      tpm: 100000
      input_cost_per_token: 0.0000068              # see the cost note below
      output_cost_per_token: 0.0000068

  - model_name: documind-sensitive                 # tag-routed alias, same deployment
    litellm_params:
      model: hosted_vllm/google/gemma-3-4b-it
      api_base: os.environ/GEMMA_VLLM_URL
      api_key: os.environ/GEMMA_ID_TOKEN
      tags: ["sensitive", "hipaa", "gdpr", "dpdpa"]
      input_cost_per_token: 0.0000068
      output_cost_per_token: 0.0000068

  # ---- offline / edge lane: Ollama on a laptop or an e2b sandbox --------------
  - model_name: documind-e2b
    litellm_params:
      model: ollama_chat/gemma3:4b
      api_base: os.environ/OLLAMA_BASE_URL
      tags: ["offline", "dev"]
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ---- managed: Gemini on the GLOBAL endpoint --------------------------------
  # Gemini 3.x generation is served ONLY from `global`. A regional vertex_location
  # here returns 404 model-not-found, and the fallback chain hides it as "the
  # gateway is flaky".
  - model_name: documind-general
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: global
      tags: ["general", "public"]
      input_cost_per_token: 0.0000015              # $1.50 / 1M, standard
      output_cost_per_token: 0.0000075             # $7.50 / 1M, standard

  - model_name: documind-reasoning
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: global
      tags: ["complex", "reasoning"]
      input_cost_per_token: 0.0000020              # $2.00 / 1M
      output_cost_per_token: 0.0000120             # $12.00 / 1M

  # ---- the fine-tune from 10.5, served on Cloud Run L4 (11.4) ---------------
  # NEW in 11.4 and named for what it is (gap G12). documind-e2b above is a different
  # thing - stock gemma3:4b on a laptop - and stays as it is. The SLM was reachable
  # before this entry only if OLLAMA_BASE_URL happened to point at it.
  - model_name: documind-slm
    litellm_params:
      model: ollama_chat/documind-slm
      api_base: os.environ/SLM_URL                 # https://documind-slm-...run.app
      api_key: os.environ/SLM_ID_TOKEN             # Cloud Run IAM, same as 11.3
      tags: ["residency-in", "tuned"]
      # Rs 86,904/month / ~50M tokens = ~Rs 0.0017 per token, either direction.
      # A RATE, not a price: it only holds at that volume.
      input_cost_per_token: 0.0000205
      output_cost_per_token: 0.0000205

  # ---- the GKE Autopilot pool from 11.5: vLLM on L4s, the batch lane ----------
  # Reached through the ClusterIP or the port-forward 11.5 sets up; the same L4
  # class as the Cloud Run SLM, so the same rate and the same caveat.
  - model_name: documind-gke
    litellm_params:
      model: hosted_vllm/google/gemma-3-4b-it
      api_base: os.environ/GKE_VLLM_URL            # http://vllm.documind.svc:8000/v1 or a port-forward
      tags: ["batch", "gke"]
      input_cost_per_token: 0.0000205
      output_cost_per_token: 0.0000205

router_settings:
  routing_strategy: simple-shuffle
  enable_tag_filtering: true
  # BIDIRECTIONAL on purpose. Self-host down -> Gemini answers. Gemini down or
  # over budget -> the self-hosted Gemma answers. Neither direction is a dead end,
  # which is what makes killing the proxy a survivable event rather than an outage.
  fallbacks:
    - documind-inference: ["documind-e2b", "documind-general"]
    - documind-e2b: ["documind-inference"]
    - documind-sensitive: ["documind-general"]
    - documind-general: ["documind-sensitive"]
    - documind-reasoning: ["documind-general"]
    # If the GPU is cold, scaled to zero, or out of quota, answer anyway. min-instances 0
    # means the SLM is sometimes genuinely absent, and a 40-second cold start is a timeout
    # to anyone waiting - Gemini answers while the GPU wakes up (11.4).
    - documind-slm: ["documind-general"]
    - documind-gke: ["documind-inference", "documind-general"]
  num_retries: 3
  timeout: 30
  allowed_fails: 3
  cooldown_time: 60
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
    AuthenticationErrorRetries: 0

# Presidio lives HERE and only here. Each backend redacts for its own logs, but the
# decision "may this text leave our perimeter" is made once, at the gateway, where
# every route passes. Put it in two places and you get two answers.
guardrails:
  - guardrail_name: "documind-pii-router"
    litellm_params:
      guardrail: custom
      mode: "pre_call"
      callback_class: documind_router.DocuMindRouter

litellm_settings:
  callbacks: ["langfuse_otel"]
  langfuse_default_tags: ["environment", "model", "tenant"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Cloud SQL Postgres over the unix socket the Cloud Run connector mounts.
  database_url: os.environ/DATABASE_URL

tag_budget_config:
  tenant-acme:
    max_budget: 500.00
    budget_duration: "30d"
  tenant-enterprise:
    max_budget: 5000.00
    budget_duration: "30d"
